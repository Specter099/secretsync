name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  ci:
    uses: Specter099/.github/.github/workflows/python-ci.yml@main
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    with:
      python-versions: '["3.11","3.12"]'
      install-command: "pip install -e .[dev]"
      lint-paths: "secretsync tests"
